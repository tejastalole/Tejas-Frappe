; NSSM service example for Windows
; 1. Download NSSM https://nssm.cc/
; 2. nssm install ExacuerZktecoAgent
; 3. Path: C:\path\to\zkteco_sync_agent\.venv\Scripts\python.exe
; 4. Arguments: agent.py --config config.json
; 5. Startup directory: C:\path\to\zkteco_sync_agent
; 6. nssm start ExacuerZktecoAgent

[Unit]
Description=Exacuer ZKTeco Sync Agent (Linux systemd example)
After=network.target

[Service]
Type=simple
WorkingDirectory=/opt/zkteco_sync_agent
ExecStart=/opt/zkteco_sync_agent/.venv/bin/python agent.py --config /opt/zkteco_sync_agent/config.json
Restart=always
RestartSec=10
User=zkteco

[Install]
WantedBy=multi-user.target
